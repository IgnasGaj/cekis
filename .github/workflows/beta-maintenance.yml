name: Beta maintenance
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: vars.BETA_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CEKIS_ENV_FILE: /dev/null
      DATABASE_URL: ${{ secrets.BETA_DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.BETA_S3_ENDPOINT }}
      S3_REGION: ${{ secrets.BETA_S3_REGION }}
      S3_BUCKET: ${{ secrets.BETA_S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.BETA_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.BETA_S3_SECRET_ACCESS_KEY }}
      BETA_APP_URL: ${{ vars.BETA_APP_URL }}
      BETA_REMINDER_WORKER_SECRET: ${{ secrets.BETA_REMINDER_WORKER_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Clean expired private receipts
        run: npm run receipts:cleanup
      - name: Send due warranty reminders
        run: node scripts/run-reminders.mjs
        env:
          APP_URL: ${{ vars.BETA_APP_URL }}
          REMINDER_WORKER_SECRET: ${{ secrets.BETA_REMINDER_WORKER_SECRET }}
