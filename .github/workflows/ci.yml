name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cekis_test
          POSTGRES_USER: cekis_owner
          POSTGRES_PASSWORD: cekis_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cekis_owner -d cekis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 1080:8025
      local_s3:
        image: ghcr.io/shyim/local-s3@sha256:058bbe6528a3219fb321cda01d0f43f96c332470b61128487643973a24a4f20d
        env:
          S3_ACCOUNT_ADMIN: testkey:testsecret
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://cekis_app:cekis_local@127.0.0.1:5433/cekis_test
      MIGRATION_DATABASE_URL: postgres://cekis_owner:cekis_local@127.0.0.1:5433/cekis_test
      APP_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-test-secret-replace-before-real-deployment-123456
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_FROM: "Čekis <prisijungimas@cekis.local>"
      REMINDER_TRANSPORT_ENABLED: "true"
      REMINDER_WORKER_SECRET: "disposable-ci-worker-secret-123456789"
      AUTH_SEND_LIMIT: "5"
      AUTH_SEND_WINDOW_SECONDS: "3600"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: cekis-ci-test
      S3_ACCESS_KEY_ID: testkey
      S3_SECRET_ACCESS_KEY: testsecret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:grant
      - run: npm run db:check-role
      - run: npm run test:db
      - run: npm run storage:init
      - run: npm run receipts:cleanup -- --dry-run
      - run: npm run lint
      - run: npm run test:lint-rules
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:reminders
      - run: npm run ocr:prepare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
