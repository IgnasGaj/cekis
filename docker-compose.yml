services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cekis
      POSTGRES_USER: cekis_owner
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run npm run setup:local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cekis_pg:/var/lib/postgresql/data
  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cekis_test
      POSTGRES_USER: cekis_owner
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run npm run setup:local}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - cekis_pg_test:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:8025"
  local_s3:
    image: ghcr.io/shyim/local-s3@sha256:058bbe6528a3219fb321cda01d0f43f96c332470b61128487643973a24a4f20d
    environment:
      S3_ACCOUNT_ADMIN: ${LOCAL_S3_ACCESS_KEY_ID:?Run npm run setup:local}:${LOCAL_S3_SECRET_ACCESS_KEY:?Run npm run setup:local}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - cekis_objects:/data
volumes:
  cekis_pg:
  cekis_pg_test:
  cekis_objects:
